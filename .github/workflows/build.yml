name: Build

# Builds every client on each push and pull request. Pushing a tag such as v0.2.0 also publishes them as a release.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      web_tag:
        description: JellyFlix-Web release to bundle into webOS and Tizen (empty = latest)
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  roku:
    name: Roku
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:roku
      - uses: actions/upload-artifact@v4
        with:
          name: roku
          path: dist/jellyflix-roku-*.zip

  webos:
    name: LG webOS
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/package-web.mjs webos ${{ inputs.web_tag && format('--tag {0}', inputs.web_tag) || '' }}
      - run: npx ares-package build/webos/app --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: webos
          path: dist/*.ipk

  tizen:
    name: Samsung Tizen
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/package-web.mjs tizen ${{ inputs.web_tag && format('--tag {0}', inputs.web_tag) || '' }}
      # A .wgt has to be signed with your own Samsung certificate (see README), so CI ships the app folder
      - run: (cd build/tizen/app && zip -qr ../../../dist-tizen-app.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-unsigned
          path: dist-tizen-app.zip

  android:
    name: Android TV / Fire TV
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JELLYFLIX_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "JELLYFLIX_KEYSTORE=$PWD/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        env:
          JELLYFLIX_KEYSTORE_PASSWORD: ${{ secrets.JELLYFLIX_KEYSTORE_PASSWORD }}
          JELLYFLIX_KEY_ALIAS: ${{ secrets.JELLYFLIX_KEY_ALIAS }}
          JELLYFLIX_KEY_PASSWORD: ${{ secrets.JELLYFLIX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [roku, webos, tizen, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "JellyFlix clients $GITHUB_REF_NAME" \
            --notes "Roku, LG webOS, Samsung Tizen (unsigned app folder) and Android TV / Fire TV builds." \
            $(find artifacts -type f)
